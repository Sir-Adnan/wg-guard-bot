name: CI

"on":
  push:
    branches: [main, master]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A new push to the same branch cancels the previous, still-running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # =========================================================================
  #  1) lint — ruff is the gate; the formatter check is informational only
  # =========================================================================
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: ruff check (gate)
        run: ruff check --output-format=github .

      - name: ruff format --check (informational)
        # Formatting drift must not fail the whole workflow: the build/test jobs
        # are what protect `main`. Run `make format` locally before pushing.
        continue-on-error: true
        run: ruff format --check .

  # =========================================================================
  #  2) test — real PostgreSQL 16 service, ENV=test, no Redis
  # =========================================================================
  test:
    name: test (pytest, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wgguard_test
          POSTGRES_USER: wgguard
          POSTGRES_PASSWORD: wgguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wgguard -d wgguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: test
      DEBUG: "false"
      TIMEZONE: Asia/Tehran
      LOG_LEVEL: INFO
      # 64 hex characters — the app refuses to start in production with a short key.
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BOT_TOKEN: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      BOT_MODE: polling
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: wgguard_test
      POSTGRES_USER: wgguard
      POSTGRES_PASSWORD: wgguard
      TEST_DATABASE_URL: postgresql+asyncpg://wgguard:wgguard@127.0.0.1:5432/wgguard_test
      REDIS_URL: ""
      PANEL_ENABLED: "true"
      PANEL_HOST: 127.0.0.1
      PANEL_PORT: "8080"
      PANEL_BASE_URL: http://127.0.0.1:8080
      OWNER_USERNAME: admin
      OWNER_PASSWORD: ci-owner-password
      ADMIN_IDS: "111111111"
      BACKUP_ENABLED: "false"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U wgguard; then
              echo "postgres is ready"; exit 0
            fi
            echo "waiting for postgres... ($attempt/30)"; sleep 2
          done
          echo "postgres did not become ready"; exit 1

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run the application test-suite
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "::notice::tests/ is not present yet — skipping the application suite"
          fi

      - name: Run the mock WG-Guard panel smoke-suite
        # Self-contained: it builds the mock app in-process (no network needed).
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tools/mock_wg_panel/test_mock_smoke.py

  # =========================================================================
  #  3) docker — prove the production image builds (build only, never push)
  # =========================================================================
  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: wgguard-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image (deps + pg_dump, no database needed)
        run: |
          docker run --rm --entrypoint sh wgguard-bot:ci -c \
            'which pg_dump && python -c "import fastapi, aiogram, alembic, sqlalchemy, asyncpg; print(\"deps ok\")"'

      - name: Show image size
        run: docker image ls wgguard-bot:ci
