# Alembic configuration for WG-Guard Bot.
# The database URL is *not* stored here: `alembic/env.py` reads it from the
# application settings so there is exactly one source of truth (the environment).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamped, ordered revision filenames.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Uncomment to auto-format migrations with ruff:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
