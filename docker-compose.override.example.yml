# ---------------------------------------------------------------------------
#  WG-Guard Bot — نمونه فایل override
#
#  این فایل را به docker-compose.override.yml کپی کنید تا docker compose
#  به‌صورت خودکار آن را روی docker-compose.yml اعمال کند:
#
#      cp docker-compose.override.example.yml docker-compose.override.yml
#      docker compose up -d
#
#  فایل docker-compose.override.yml در .gitignore است؛ یعنی تنظیمات محلی شما
#  هرگز به مخزن push نمی‌شود.
# ---------------------------------------------------------------------------
#
#  English: copy this file to `docker-compose.override.yml` and Compose will
#  merge it automatically over `docker-compose.yml`.  Every block below is
#  commented out — uncomment only what you need.
# ---------------------------------------------------------------------------

services:
  # =========================================================================
  #  ۱) باز کردن پورت دیتابیس برای عیب‌یابی
  #
  #  فقط برای کارهای موقت (psql، pgAdmin، مهاجرت دستی). هرگز پورت دیتابیس را
  #  روی 0.0.0.0 باز نکنید؛ همیشه 127.0.0.1 تا فقط از خود سرور در دسترس باشد.
  # =========================================================================
  # db:
  #   ports:
  #     - "127.0.0.1:5432:5432"

  # =========================================================================
  #  ۲) اتصال به شبکه‌ی یک پروکسی معکوس موجود (Nginx Proxy Manager، Traefik،
  #     Caddy و…). شبکه‌ی بیرونی را یک‌بار بسازید:
  #
  #       docker network create proxy
  #
  #  سپس نام شبکه را همان‌جا که نوشته شده «proxy» بگذارید.
  # =========================================================================
  # bot:
  #   networks:
  #     - default
  #     - proxy
  #
  #   # پورت روی میزبان لازم نیست وقتی پروکسی معکوس از داخل شبکه وصل می‌شود؛
  #   # در این حالت خط زیر را باز کنید تا پنل فقط از داخل سرور قابل دسترس باشد.
  #   # ports:
  #   #   - "127.0.0.1:${PANEL_PORT:-8080}:${PANEL_PORT:-8080}"

  # =========================================================================
  #  ۳) فعال کردن حالت «پشت پروکسی معکوس»
  #
  #  با true شدن این گزینه، برنامه به هدرهای X-Forwarded-For / X-Forwarded-Proto
  #  اعتماد می‌کند (IP واقعی کاربر و تشخیص HTTPS برای کوکی‌های امن).
  #  اگر PANEL_BASE_URL شما https:// است، این گزینه را هم true کنید.
  # =========================================================================
  # bot:
  #   environment:
  #     PANEL_BEHIND_PROXY: "true"
  #     # آدرس عمومی واقعی؛ برای ساخت لینک‌های مطلق و ریدایرکت‌ها لازم است
  #     PANEL_BASE_URL: "https://bot.example.com"

  # =========================================================================
  #  ۴) نمونه‌های تکمیلی (اختیاری)
  # =========================================================================
  # bot:
  #   # تگ‌کردن نسخه‌ی ایمیج برای برگشت سریع به نسخه‌ی قبلی
  #   image: wgguard-bot:1.0.0
  #   # پشتیبان‌گیری روی دیسک میزبان به‌جای volume
  #   volumes:
  #     - ./backups:/app/backups
  #   # محدودیت منابع (برای VPS های کوچک)
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 768M

# شبکه‌ی بیرونی مورد استفاده در بخش ۲
# networks:
#   proxy:
#     external: true
