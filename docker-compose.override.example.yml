# ---------------------------------------------------------------------------
#  WG-Guard Bot — docker compose override example
#
#  Copy this file to `docker-compose.override.yml` and Compose will merge it
#  automatically over `docker-compose.yml`:
#
#      cp docker-compose.override.example.yml docker-compose.override.yml
#      docker compose up -d
#
#  `docker-compose.override.yml` is in .gitignore, so your local settings are
#  never pushed to the repository.  Every block below is commented out —
#  uncomment only what you need.
#
#  English on purpose: this file is edited on a server terminal, which has no
#  bidi support and renders Persian backwards (see AGENTS.md §6).
# ---------------------------------------------------------------------------

services:
  # =========================================================================
  #  1) Opening the database port for debugging
  #
  #  For temporary work only (psql, pgAdmin, a manual migration).  Never bind the
  #  database to 0.0.0.0 — keep it on 127.0.0.1 so only this server can reach it.
  # =========================================================================
  # db:
  #   ports:
  #     - "127.0.0.1:5432:5432"

  # =========================================================================
  #  2) Joining an existing reverse proxy (Nginx Proxy Manager, Traefik, Caddy…)
  #
  #  Create the external network once:
  #
  #      docker network create proxy
  #
  #  Then use the same name where "proxy" appears below.
  # =========================================================================
  # bot:
  #   networks:
  #     - default
  #     - proxy
  #
  #   # No host port is needed when the reverse proxy connects over the network;
  #   # uncomment the lines below to keep the panel reachable from this server only.
  #   # ports:
  #   #   - "127.0.0.1:${PANEL_PORT:-8080}:${PANEL_PORT:-8080}"

  # =========================================================================
  #  3) Turning on "behind a reverse proxy" mode
  #
  #  With this set to true the application trusts the X-Forwarded-For /
  #  X-Forwarded-Proto headers (the real client IP, and HTTPS detection for
  #  secure cookies).  Set it to true whenever PANEL_BASE_URL is https://.
  # =========================================================================
  # bot:
  #   environment:
  #     PANEL_BEHIND_PROXY: "true"
  #     # The real public address; needed for absolute links and redirects
  #     PANEL_BASE_URL: "https://bot.example.com"

  # =========================================================================
  #  4) Extra examples (optional)
  # =========================================================================
  # bot:
  #   # Tag the image version so you can roll back quickly
  #   image: wgguard-bot:1.0.0
  #   # Keep backups on the host disk instead of in a volume
  #   volumes:
  #     - ./backups:/app/backups
  #   # Resource limits (for small VPS plans)
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 768M

# The external network used in section 2
# networks:
#   proxy:
#     external: true
