[project]
name = "wg-guard-bot"
version = "1.0.0"
description = "Telegram VPN shop bot for WG-Guard (AmneziaWG) panels — sales, card-to-card receipts, admin panel"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sir-Adnan" }]
keywords = ["telegram", "bot", "vpn", "wireguard", "amneziawg", "wg-guard", "aiogram", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/Sir-Adnan/wg-guard-bot"
Repository = "https://github.com/Sir-Adnan/wg-guard-bot"
Issues = "https://github.com/Sir-Adnan/wg-guard-bot/issues"
Changelog = "https://github.com/Sir-Adnan/wg-guard-bot/blob/main/docs/CHANGELOG.md"
Documentation = "https://github.com/Sir-Adnan/wg-guard-bot/tree/main/docs"
"Upstream panel" = "https://github.com/Sir-Adnan/wg-guard"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # FastAPI Depends() in defaults is intentional
    "RUF001", # Persian/ambiguous unicode in strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The database engine fixture is session-scoped, so every test and fixture must
# share one event loop; otherwise asyncpg connections cross loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Both suites run from a bare `pytest`.  The mock WG-Guard panel lives outside
# tests/ because it is a test double the app talks to over HTTP, but it is part
# of the suite: `pythonpath` makes `mock_wg_panel` importable without the
# PYTHONPATH= incantation that used to be needed.
testpaths = ["tests", "tools/mock_wg_panel"]
pythonpath = ["tools"]
addopts = "--strict-markers"
markers = [
    "db: requires a live PostgreSQL (set TEST_DATABASE_URL)",
    "panel: requires the mock WG-Guard panel",
]
filterwarnings = ["ignore::DeprecationWarning"]
